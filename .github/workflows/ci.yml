# ============================================================
# PropSentry — GitHub Actions CI Pipeline
# ============================================================
# Runs on every push and pull request to main.
# Tests run headless (no MT5 terminal) using mock_mt5 fixture.
# ============================================================

name: CI — PropSentry Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Lint & Type Check ──────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies (no MetaTrader5)
        run: |
          pip install --upgrade pip
          pip install \
            pydantic>=2.7.0 pydantic-settings>=2.2.0 pytz>=2024.1 \
            pandas>=2.2.0 numpy>=1.26.0 redis>=5.0.0 \
            "python-telegram-bot>=21.0" sqlalchemy>=2.0.0 \
            httpx>=0.27.0 loguru>=0.7.0 pyyaml>=6.0.1 \
            fastapi>=0.111.0 uvicorn>=0.30.0 \
            ruff>=0.4.0 mypy>=1.10.0

      - name: Ruff — Lint
        run: ruff check src/ tests/ scripts/ config/

      - name: Ruff — Format check
        run: ruff format --check src/ tests/ scripts/ config/

  # ── Unit Tests ────────────────────────────────────────────────────
  test:
    name: Unit Tests (headless, no MT5)
    runs-on: ubuntu-latest
    needs: lint

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies (no MetaTrader5)
        run: |
          pip install --upgrade pip
          pip install \
            pydantic>=2.7.0 pydantic-settings>=2.2.0 pytz>=2024.1 \
            pandas>=2.2.0 numpy>=1.26.0 redis>=5.0.0 \
            "python-telegram-bot>=21.0" sqlalchemy>=2.0.0 \
            httpx>=0.27.0 loguru>=0.7.0 pyyaml>=6.0.1 \
            fastapi>=0.111.0 uvicorn>=0.30.0 \
            pytest>=8.0.0 pytest-asyncio>=0.23.0 pytest-mock>=3.14.0

      - name: Create required directories
        run: mkdir -p data/historical data/backups data/cache logs

      - name: Run tests
        env:
          REDIS__HOST: localhost
          REDIS__PORT: "6379"
          DATABASE__URL: "sqlite:///./data/test.db"
        run: |
          python -m pytest tests/ -v --tb=short --no-header \
            --junit-xml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # ── Docker Build ──────────────────────────────────────────────────
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: final
          push: false
          tags: propsentry-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dev/test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.dev
          push: false
          tags: propsentry-dev:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
